<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 108 108">
    <!-- Fondo azul degradado -->
    <defs>
        <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0D47A1"/>
            <stop offset="50%" stop-color="#1976D2"/>
            <stop offset="100%" stop-color="#42A5F5"/>
        </linearGradient>
        <linearGradient id="sky_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#80BBDEFB"/>
            <stop offset="100%" stop-color="#002196F3" stop-opacity="0"/>
        </linearGradient>
    </defs>
    
    <!-- Fondo azul degradado -->
    <rect x="0" y="0" width="108" height="108" fill="url(#bg_gradient)"/>
    
    <!-- Efecto de luz en la parte superior para simular el cielo -->
    <rect x="0" y="0" width="108" height="40" fill="url(#sky_gradient)"/>
    
    <!-- Carretera para dar contexto al taxi -->
    <rect x="0" y="75" width="108" height="33" fill="#424242"/>
    
    <!-- Línea central de la carretera -->
    <rect x="0" y="91.5" width="20" height="1" fill="#FFEB3B"/>
    <rect x="30" y="91.5" width="20" height="1" fill="#FFEB3B"/>
    <rect x="60" y="91.5" width="20" height="1" fill="#FFEB3B"/>
    <rect x="90" y="91.5" width="18" height="1" fill="#FFEB3B"/>
    
    <!-- Fondo circular blanco para el logo -->
    <circle cx="54" cy="54" r="40" fill="#FFFFFF"/>
    
    <!-- Letra G en rojo -->
    <path d="M36,40L56,40C58,40 60,42 60,44L60,46L41,46L41,52L51,52L51,58L41,58L41,64L56,64C58,64 60,62 60,60L60,58L51,58L51,52L60,52L60,44C60,42 58,40 56,40Z" fill="#FF0000"/>
    
    <!-- Letra T en negro -->
    <path d="M60,40L75,40L75,45L70,45L70,70L65,70L65,45L60,45L60,40Z" fill="#000000"/>
    
    <!-- Letra x en negro -->
    <path d="M77,40L82,40L87,50L92,40L97,40L89,55L97,70L92,70L87,60L82,70L77,70L85,55L77,40Z" fill="#000000"/>
</svg>